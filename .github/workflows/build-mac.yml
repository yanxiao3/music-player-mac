name: 构建 macOS 版

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 使用官方 npm 源（CI 网络）
        run: |
          rm -f .npmrc
          npm config set registry https://registry.npmjs.org

      - name: 安装依赖
        run: npm install --registry=https://registry.npmjs.org

      - name: 还原应用图标
        run: base64 -d electron/icon.png.b64 > electron/icon.png

      - name: 构建渲染进程
        run: npm run build:electron

      - name: 打包 macOS 应用（universal：Intel + Apple Silicon 通用）
        run: npx electron-builder --mac --config.directories.output=release

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-${{ github.run_number }}
          files: release/*.dmg
          fail_on_unmatched: true
